name: Bug 报告
description: 报告弦外的问题 / Report a problem with Xianwai
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进弦外！安全漏洞请走 SECURITY.md 的私密通告流程，不要公开提交。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - 浏览器（Windows）
        - 浏览器（其他）
        - 安卓
        - iPhone
        - 构建脚本
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 0.6.1，或提交哈希
      placeholder: "0.6.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 出现了什么问题？
      description: 实际表现，包括报错信息
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始的分步操作
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现报错
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器或安卓版本、模型来源（本地或云端）
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已从报告中移除个人信息、API 密钥和真实对话内容
          required: true
