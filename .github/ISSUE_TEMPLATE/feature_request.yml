name: 功能建议
description: 提出弦外的功能建议 / Suggest an idea for Xianwai
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！欢迎用中文描述。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在有什么不便或缺失？
      placeholder: 作为……的用户，我发现……很难做到
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: platform
    attributes:
      label: 涉及哪些端？
      options:
        - 全部端
        - 浏览器
        - 安卓
        - iPhone
        - 文档
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 截图、对话示例（请脱敏）、链接
